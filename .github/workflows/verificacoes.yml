# Roda lint, testes e build no GitHub a cada push na main e em todo Pull Request para a main.
# O resultado aparece na aba Actions e no próprio PR (verde = passou, vermelho = falhou).
name: Verificações

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # botão "Run workflow" na aba Actions, para rodar sem precisar de push
  workflow_dispatch:

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # o Vite 8 pede Node 20.19 ou mais recente
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # vulnerabilidade alta ou crítica nas dependências que vão para o site faz o PR falhar.
      # As de desenvolvimento (ex.: o CLI do shadcn) ficam de fora: não chegam a quem usa a loja
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm test

      # não precisa de .env: o build só grava as variáveis VITE_ no código, e vazias ele aceita
      - run: npm run build
